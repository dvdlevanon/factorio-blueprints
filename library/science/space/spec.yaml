  - 'power: all powered, 28 poles in one network'
  - 'belts: 9 curves, 2 sideloads, 6 dead ends, 6 underground pairs'
  - 'power: 1 bridge poles'
  - 'belts: 9 curves, 2 sideloads, 6 dead ends - all intended'
  - 'fluids: one light-oil network, all 40 rocket fuel machines on it'
  - 'flow: 42 machines each get all ingredients; 95 inserters move items their target uses; no item rides a belt
