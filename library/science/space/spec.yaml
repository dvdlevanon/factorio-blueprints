  ratios: "\\\nRate: one silo (David: \"do what makes sense\"; 45/s would be 15 silos and ~570 rocket fuel assemblers).\n\
    rocket: 100 parts x 3 s (silo speed 1) = 300 s + launch (~30-45 s, not verified offline) -> ~2.9 packs/s.\n\
    per rocket: 1000 PU, 1000 LDS, 1000 rocket fuel (+ satellite: 100 LDS, 100 PU, 50 fuel, 100 solar, 100 accumulators,\n\
    \  5 radars). Averaged: PU and LDS ~3.2/s, fuel ~3.05/s, solar and accumulators ~0.3/s.\nwhile building parts\
    \ the silo takes 3.33/s of each: 4 fast (PU | LDS) + 3 long-handed (fuel, 3.6/s).\nrocket fuel: 10 solid fuel\
    \ + 10 light oil, 15 s -> 0.083/s per AM3; 40 built = 3.33/s. Solid fuel 30.4/s, oil 30.4/s."
  bottleneck: the silo (crafting + launch time)
  validators:
