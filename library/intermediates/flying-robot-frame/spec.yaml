label: "Flying Robot Frame"
description: |
  4 cells wide x 1 tall. 3 mirrored pairs of rows (44 machines per row). Each pair has its own two mixed
  belts in the middle: A = electric engine | battery, B = green | steel (near belt by fast, far belt by
  long-handed inserter). Each input turns down its own column on the right; splitters give each pair a
  third. Output rows collect on the left into two collectors that sideload the yellow output from both
  sides (one lane each). Gaps in the rows clear the grid poles between the cells. Includes the 10 corner roboports.
icons:
  - {type: item, name: flying-robot-frame}

status: built

request:
  product: flying-robot-frame
  rate: "1 yellow belt (15/s)"     # 2026-11-18: "flying make single yellow output"
  footprint: {cells_max: "as needed (240 asms)"}

result:
  footprint: {cells: "4x1 (horizontal)", tiles: "172x40 + 10 corner roboports", placement: "not rotation-safe"}
  inputs:      # all from the right, top rows (marked by a panel between an underground pair)
    - {item: electric-engine-unit, belts: "1/3 blue (15/s)"}
    - {item: battery, belts: "2/3 blue (30/s)"}
    - {item: electronic-circuit, belts: "1 full blue (45/s) - the limit"}
    - {item: steel-plate, belts: "1/3 blue (15/s)"}
  outputs:
    - {item: flying-robot-frame, belts: "1 full yellow (15/s), left, middle, both lanes"}
  machines:
    - {entity: assembling-machine-3, recipe: flying-robot-frame, count: 264}
    - {entity: fast-inserter, count: 528}
    - {entity: long-handed-inserter, count: 264}
    - {entity: express-splitter, count: 8}
    - {entity: express-underground-belt, count: 26}
    - {entity: medium-electric-pole, count: 288}
    - {entity: small-lamp, count: 54}
    - {entity: display-panel, count: 5}
    - {entity: roboport, count: 10, role: "cell corners, for alignment"}
  ratios: |
    flying-robot-frame: 1 electric engine + 2 battery + 1 steel + 3 green, 20 s; AM3 1.25 -> 0.0625/s per asm.
    15/s needs 240; 264 built (16.5/s). Per pair (88 machines, 5/s): engine 5, battery 10, green 15, steel 5 -
    every lane well under 22.5, no top-ups needed.
    Output: each collector gets 2 out rows (8.25/s) onto one yellow lane (7.5).
  bottleneck: "green input = 1 full blue belt = output 15/s (and the yellow belt itself)"
  validators: {collisions: pass, grid: "4x1 cells, no grid collision, grid link 1.6", power: "pass (288 poles, one network)",
               inserters: "pass (every machine reaches all 4 ingredients; frames reach the output)",
               belts: "9 sideloads (6 formers, 2 collector joins, output merge), 36 intended curves, 13 underground pairs, ends = output + 6 row ends"}

check_in_game:
